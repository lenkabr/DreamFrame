name: DreamFrame safety checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dreamframe-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download the project
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Check code quality
        run: npm run lint

      - name: Verify the production build
        run: npm run build:pages
